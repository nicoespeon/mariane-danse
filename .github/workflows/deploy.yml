name: Vérifier et déployer

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Types, build et qualité
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.secrets.outputs.deployable }}
    steps:
      # Le contexte `secrets` n'est pas lisible depuis un `if` de job : on passe
      # par une sortie pour que le déploiement se saute tout seul tant que
      # Cloudflare n'est pas configuré.
      - id: secrets
        run: echo "deployable=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium webkit

      - run: pnpm run check
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY }}

      # Les rapports ne sont écrits que lorsqu'une assertion casse
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: rapports-qualite
          path: |
            .lighthouseci/
            playwright-report/
            test-results/
          retention-days: 7

      - uses: actions/upload-artifact@v5
        with:
          name: site
          path: dist/

  deployer:
    name: Déployer sur Cloudflare Pages
    needs: verifier
    if: needs.verifier.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    # Les PR obtiennent une préversion, `main` va en production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: site
          path: dist

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mariane-danse --branch=${{ github.head_ref || github.ref_name }}
