name: Vérifier et déployer

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Types, build et qualité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run format:check

      - run: pnpm run check:types

      - run: pnpm run build
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY }}

      # Bloque la fusion si la performance, l'accessibilité ou le SEO régressent
      - run: pnpm run check:quality

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-lighthouse
          path: .lighthouseci/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/

  deployer:
    name: Déployer sur Cloudflare Pages
    needs: verifier
    runs-on: ubuntu-latest
    # Les PR obtiennent une préversion, `main` va en production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mariane-danse --branch=${{ github.head_ref || github.ref_name }}
